# Copy to .github/workflows/lians-check.yml, and copy action.yml + lians_check.py to .github/actions/lians-check/.
name: Lians check
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  issues:
    types: [edited]          # a ticket changed: re-check the open PRs built from it
permissions:
  contents: read
  pull-requests: write
  issues: write
concurrency:
  group: lians-check-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/lians-check
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          linear-api-key: ${{ secrets.LINEAR_API_KEY }}
